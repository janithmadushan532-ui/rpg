name: Move to Root
on: [push]
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Files to Root
        shell: bash
        run: |
          ls -la
          if [ -d "angry-aliens-phaser-main" ]; then
            cp -a angry-aliens-phaser-main/. .
            rm -rf angry-aliens-phaser-main
            echo "Moved OK"
          else
            echo "Folder not found"
            ls -R
          fi
      - name: Save
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Moved to root" || echo "Done"
          git push 
