name: Unzip File
on: [push]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip File
        run: |
          ls -la
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \;
          find . -maxdepth 2 -name "*.zip" -delete
          ls -R
      - name: Save Files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto Extracted" || echo "No changes"
          git push 
